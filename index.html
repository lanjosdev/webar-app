<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#07111f" />
    <meta
      name="description"
      content="POC mínimo de WebAR World Tracking com 8th Wall e Three.js"
    />
    <title>WebAR World Tracking POC</title>
    <link rel="stylesheet" href="/src/styles/global.css" />
    <script src="%BASE_URL%external/xr/xr.js" async></script>
  </head>
  <body>
    <main id="app">
      <canvas
        id="camera-feed"
        aria-label="Visualização da câmera com conteúdo em realidade aumentada"
      ></canvas>

      <div
        id="placement-reticle"
        class="placement-reticle"
        aria-hidden="true"
        hidden
      ></div>

      <div
        id="interaction-blocker"
        class="interaction-blocker"
        aria-hidden="true"
        hidden
      ></div>

      <section
        id="status-panel"
        class="status-panel"
        data-phase="idle"
        data-placement="not-placed"
        aria-live="polite"
      >
        <p class="eyebrow">8th Wall · World Tracking</p>
        <h1>WebAR POC</h1>
        <p id="status-message">Pronto para iniciar a experiência.</p>
        <p id="error-details" class="error-details" hidden></p>
        <div
          id="recenter-confirmation"
          class="recenter-confirmation"
          role="alertdialog"
          aria-modal="true"
          aria-labelledby="recenter-confirmation-message"
          hidden
        >
          <p id="recenter-confirmation-message">
            Recentralizar removerá o objeto posicionado. Deseja continuar?
          </p>
          <div class="confirmation-actions">
            <button id="cancel-recenter" type="button">Cancelar</button>
            <button id="confirm-recenter" type="button">Recentralizar</button>
          </div>
        </div>
        <button id="start-ar" type="button">Iniciar AR</button>
      </section>

      <button id="recenter-ar" class="recenter-button" type="button" hidden>
        Recentrar
      </button>
    </main>

    <noscript>Ative o JavaScript para iniciar a experiência WebAR.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
